name: Checks

on:
  pull_request:

jobs:
  binder:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: xbw6uf6e
      NEXT_PUBLIC_SANITY_DATASET: production
      SANITY_STUDIO_PROJECT_ID: xbw6uf6e
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:binder
      - run: npm run build
